name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build Standalone Binaries
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish GUI Application (Single-File Standalone win-x64)
        run: |
          dotnet publish src/LinuxReader.Gui/LinuxReader.Gui.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            --output ./artifacts/gui-win-x64

      - name: Publish CLI Application (Single-File Standalone win-x64)
        run: |
          dotnet publish src/LinuxReader.Cli/LinuxReader.Cli.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            --output ./artifacts/cli-win-x64

      - name: Package ZIP Archives
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./dist
          Compress-Archive -Force -Path ./artifacts/gui-win-x64/LinuxReader.exe -DestinationPath ./dist/LinuxReader-GUI-win-x64.zip
          Compress-Archive -Force -Path ./artifacts/cli-win-x64/linux-reader-cli.exe -DestinationPath ./dist/LinuxReader-CLI-win-x64.zip

      - name: Install Inno Setup
        continue-on-error: true
        run: choco install innosetup --no-progress

      - name: Compile Windows Setup Installer
        continue-on-error: true
        shell: pwsh
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          $isccCandidates = @(
            "C:\ProgramData\chocolatey\bin\iscc.exe",
            (Get-Command iscc -ErrorAction SilentlyContinue)?.Source,
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path $_) }

          $iscc = $isccCandidates | Select-Object -First 1
          if ($iscc) {
            Write-Host "Compiling Inno Setup Windows Installer using: $iscc"
            Push-Location installer
            & $iscc setup.iss
            Pop-Location
          } else {
            Write-Warning "ISCC not found, skipping installer compilation."
          }

      - name: Generate Checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path ./dist -File | Where-Object { $_.Name -notlike "*.txt" } | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash)  $($_.Path | Split-Path -Leaf)"
          } | Out-File -FilePath ./dist/SHA256SUMS.txt -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ./dist/*.exe
            ./dist/*.zip
            ./dist/*.txt
          draft: false
          prerelease: false
          generate_release_notes: true
          draft: false
          prerelease: false
          generate_release_notes: true
